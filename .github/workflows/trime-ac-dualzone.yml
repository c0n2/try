name: Trime AC dual-zone build

on:
  push:
    branches: [trime-ac-dualzone-build]

permissions:
  contents: read

env:
  CI_NAME: AC Dual-Zone Build
  BUILD_ABI: arm64-v8a
  TRIME_REF: 75844aef84f3849c7f6dd49a52bb75c46200af44

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v7
        with:
          path: harness

      - name: Checkout pinned Trime
        uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: trime/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: RED - add base tests only
        run: python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests

      - name: RED - prove base tests fail before implementation
        shell: bash
        run: |
          cd trime
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.keyboard.AcDualZoneTest \
            --tests com.osfans.trime.data.theme.AcDualZoneTextKeyTest \
            > ../red-base.log 2>&1
          rc=$?
          set -e
          tail -n 100 ../red-base.log
          if [ "$rc" -eq 0 ]; then
            echo "Base RED phase unexpectedly passed"
            exit 1
          fi
          grep -Eq "Unresolved reference|acLeftId|AcDualZoneSide|resolveAcDualZoneSide" ../red-base.log
          echo "BASE_RED_PHASE_CONFIRMED"

      - name: GREEN - apply base implementation
        run: python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl

      - name: RED 4.7.1 - add daemon forwarding regression test
        run: python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests

      - name: RED 4.7.1 - prove daemon facade lacks explicit forwarder
        shell: bash
        run: |
          cd trime
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.daemon.RimeApiForwarderTest \
            > ../red-hotfix.log 2>&1
          rc=$?
          set -e
          tail -n 100 ../red-hotfix.log
          if [ "$rc" -eq 0 ]; then
            echo "Hotfix RED phase unexpectedly passed"
            exit 1
          fi
          grep -Eq "RimeApiForwarder|Unresolved reference" ../red-hotfix.log
          echo "HOTFIX_RED_PHASE_CONFIRMED"

      - name: GREEN 4.7.1 - apply daemon forwarding fix
        run: python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl

      - name: RED v1.3 - add CtrlSpace and CtrlA regression tests
        run: python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests

      - name: RED v1.3 - prove new policy and fallback do not exist yet
        shell: bash
        run: |
          cd trime
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.keyboard.AcCtrlSpacePolicyTest \
            --tests com.osfans.trime.ime.core.AcSelectAllFallbackTest \
            > ../red-v13.log 2>&1
          rc=$?
          set -e
          tail -n 120 ../red-v13.log
          if [ "$rc" -eq 0 ]; then
            echo "v1.3 RED phase unexpectedly passed"
            exit 1
          fi
          grep -Eq "AcCtrlSpaceAction|resolveAcCtrlSpaceAction|AcSelectionRange|computeAcSelectAllFallbackRange|Unresolved reference" ../red-v13.log
          echo "V13_RED_PHASE_CONFIRMED"

      - name: GREEN v1.3 - apply native CtrlSpace and CtrlA fallback
        run: python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl

      - name: RED v1.3.1 - add real Ctrl+A key-event regression test
        run: python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests

      - name: RED v1.3.1 - prove real Ctrl+A chord is not implemented yet
        shell: bash
        run: |
          cd trime
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.core.AcSelectAllKeyEventTest \
            > ../red-v131.log 2>&1
          rc=$?
          set -e
          tail -n 100 ../red-v131.log
          if [ "$rc" -eq 0 ]; then
            echo "v1.3.1 RED phase unexpectedly passed"
            exit 1
          fi
          grep -Eq "AcKeyChord|acSelectAllKeyChord|Unresolved reference" ../red-v131.log
          echo "V131_RED_PHASE_CONFIRMED"

      - name: GREEN v1.3.1 - dispatch real Ctrl+A before API fallbacks
        run: python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl

      - name: Verify patch hygiene
        run: |
          cd trime
          git add -N .
          git diff --check
          git status --short
          git diff > ../trime-ac-dualzone-v1.3.1.patch

      - name: GREEN - focused regression tests
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.keyboard.AcDualZoneTest \
            --tests com.osfans.trime.data.theme.AcDualZoneTextKeyTest \
            --tests com.osfans.trime.daemon.RimeApiForwarderTest \
            --tests com.osfans.trime.ime.keyboard.AcCtrlSpacePolicyTest \
            --tests com.osfans.trime.ime.core.AcSelectAllFallbackTest \
            --tests com.osfans.trime.ime.core.AcSelectAllKeyEventTest

      - name: GREEN - full debug unit-test suite
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest

      - name: Build patched debug APK
        run: |
          cd trime
          make debug

      - name: Verify APK exists
        shell: bash
        run: |
          find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print
          test -n "$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload patched APK and patch
        uses: actions/upload-artifact@v7
        with:
          name: trime-ac-dualzone-v1.3.1-arm64
          path: |
            trime/app/build/outputs/apk/debug/*.apk
            trime-ac-dualzone-v1.3.1.patch
            red-base.log
            red-hotfix.log
            red-v13.log
            red-v131.log
          retention-days: 30

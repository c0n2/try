name: Trime AC v1.5 Ctrl+P add-word build

on:
  push:
    branches: [trime-ac-ctrlp-addword-v15]

permissions:
  contents: read

env:
  CI_NAME: AC CtrlP AddWord Build
  BUILD_ABI: arm64-v8a
  TRIME_REF: 75844aef84f3849c7f6dd49a52bb75c46200af44
  FROST_REF: 2a027a0affdadd43194e6b3dc12cfffdd1426379
  FROST_CHARS_SHA256: c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92
  STEM_ASSET_SHA256: 72c1fef8f31ffd5643391f3bc6c22c74f474218284fc5fcc2c688874aab2bf4b

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v7
        with:
          path: harness

      - name: Checkout pinned Trime
        uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: trime/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: Restore verified base through v1.4
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta

      - name: RED v1.5 - add Ctrl+P tests only
        run: python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests

      - name: RED v1.5 - prove add-word layer does not exist yet
        shell: bash
        run: |
          cd trime
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.core.AcAddWordShortcutTest \
            --tests com.osfans.trime.data.prefs.AcKeyboardHookDefaultsTest \
            > ../red-v15.log 2>&1
          rc=$?
          set -e
          tail -n 140 ../red-v15.log
          if [ "$rc" -eq 0 ]; then
            echo "v1.5 RED phase unexpectedly passed"
            exit 1
          fi
          grep -Eq "resolveAcAddWordShortcut|AC_ADD_WORD_SCHEMA_ID|encodeAcWubi86Word|CTRL_P|Unresolved reference" ../red-v15.log
          echo "V15_RED_PHASE_CONFIRMED"

      - name: Download pinned Frost Wubi character source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = "2a027a0affdadd43194e6b3dc12cfffdd1426379"
          url = f"https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml"
          data = urllib.request.urlopen(url, timeout=60).read()
          got = hashlib.sha256(data).hexdigest()
          expected = "c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92"
          if got != expected:
              raise SystemExit(f"Frost chars SHA mismatch: {got}")
          pathlib.Path("frost-chars.dict.yaml").write_bytes(data)
          print("FROST_CHARS_PINNED_SHA256_PASS", got)
          PY

      - name: GREEN v1.5 - apply Ctrl+P add-word layer
        run: |
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post

      - name: Verify production hygiene
        shell: bash
        run: |
          cd trime
          git add -N .
          git diff --check
          git status --short
          git diff > ../trime-ac-dualzone-v1.5-ctrlp-addword.patch
          if grep -R "ACIME_DIAG" app/src/main app/src/test; then
            echo "Diagnostic logging leaked into v1.5"
            exit 1
          fi
          grep -F 'const val CTRL_P = true' app/src/main/java/com/osfans/trime/data/prefs/AcKeyboardHookDefaults.kt
          grep -F 'val hookCtrlP = switch(R.string.hook_ctrl_p, HOOK_CTRL_P, AcKeyboardHookDefaults.CTRL_P)' app/src/main/java/com/osfans/trime/data/prefs/AppPrefs.kt
          grep -F 'resolveAcAddWordShortcut(' app/src/main/java/com/osfans/trime/ime/core/TrimeInputMethodService.kt
          grep -F 'UserDictManager.importUserDict(' app/src/main/java/com/osfans/trime/ime/core/TrimeInputMethodService.kt
          grep -F 'AC_ADD_WORD_USER_DICT' app/src/main/java/com/osfans/trime/ime/core/TrimeInputMethodService.kt
          grep -F 'android.text.InputType.TYPE_CLASS_TEXT' app/src/main/java/com/osfans/trime/ime/core/TrimeInputMethodService.kt
          test "$(wc -l < app/src/main/assets/ac_wubi86_stems.tsv)" -eq 27529
          echo "${STEM_ASSET_SHA256}  app/src/main/assets/ac_wubi86_stems.tsv" | sha256sum -c -
          if git diff --name-only | grep -F 'tongwenfeng.trime.yaml'; then
            echo "tongwenfeng.trime.yaml must remain untouched"
            exit 1
          fi
          ! grep -F 'normalizeMetaState' app/src/main/java/com/osfans/trime/ime/core/AcCtrlVimShortcut.kt
          grep -F 'KeyEvent.META_CTRL_LEFT_ON' app/src/main/java/com/osfans/trime/ime/core/AcCtrlVimShortcut.kt

      - name: GREEN focused regressions
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.keyboard.AcDualZoneTest \
            --tests com.osfans.trime.data.theme.AcDualZoneTextKeyTest \
            --tests com.osfans.trime.daemon.RimeApiForwarderTest \
            --tests com.osfans.trime.ime.keyboard.AcCtrlSpacePolicyTest \
            --tests com.osfans.trime.ime.core.AcSelectAllFallbackTest \
            --tests com.osfans.trime.ime.core.AcSelectAllKeyEventTest \
            --tests com.osfans.trime.ime.core.AcCtrlVimShortcutTest \
            --tests com.osfans.trime.data.prefs.AcKeyboardHookDefaultsTest \
            --tests com.osfans.trime.ime.core.AcAddWordShortcutTest

      - name: GREEN full debug unit-test suite
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest

      - name: Build patched debug APK
        run: |
          cd trime
          make debug

      - name: Verify APK exists
        shell: bash
        run: |
          find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print
          test -n "$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload v1.5 APK and evidence
        uses: actions/upload-artifact@v7
        with:
          name: trime-ac-v1.5-ctrlp-addword-arm64
          path: |
            trime/app/build/outputs/apk/debug/*.apk
            trime-ac-dualzone-v1.5-ctrlp-addword.patch
            red-v15.log
          retention-days: 30

name: Trime AC v1.5.4 dedicated data root

on:
  push:
    branches: [trime-ac-v154-dedicated-root]

permissions:
  contents: read

env:
  CI_NAME: AC Trime v1.5.4 Dedicated Data Root
  BUILD_ABI: arm64-v8a
  TRIME_REF: 75844aef84f3849c7f6dd49a52bb75c46200af44
  FROST_REF: 2a027a0affdadd43194e6b3dc12cfffdd1426379
  FROST_CHARS_SHA256: c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92
  STEM_ASSET_SHA256: 72c1fef8f31ffd5643391f3bc6c22c74f474218284fc5fcc2c688874aab2bf4b
  AC_DEBUG_CERT_SHA256: 046B7F50C9BA2FD1E810EEABF246A4A5019F8344D52CEBE6C61EEF7E99CEC181

jobs:
  red-dedicated-root:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - name: Restore v1.5.3 fixed-signing source baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = "2a027a0affdadd43194e6b3dc12cfffdd1426379"
          url = f"https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml"
          data = urllib.request.urlopen(url, timeout=60).read()
          got = hashlib.sha256(data).hexdigest()
          expected = "c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92"
          if got != expected:
              raise SystemExit(f"Frost chars SHA mismatch: {got}")
          pathlib.Path("frost-chars.dict.yaml").write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
      - name: RED v1.5.4 dedicated-root contract
        shell: bash
        run: |
          set +e
          python3 harness/trime-ac-dualzone/verify_v154_dedicated_root.py trime > red-v154-dedicated-root.log 2>&1
          rc=$?
          set -e
          cat red-v154-dedicated-root.log
          if [ "$rc" -eq 0 ]; then
            echo "Expected v1.5.3 baseline to fail v1.5.4 dedicated-root contract"
            exit 1
          fi
          grep -F 'FAIL=EXTERNAL_SYNC_IS_AC_FRESH_INSTALL_DEFAULT' red-v154-dedicated-root.log
          grep -F 'FAIL=AC_DEDICATED_ROOT_IS_DECLARED' red-v154-dedicated-root.log
          grep -F 'FAIL=IMPORT_FAILURE_DOES_NOT_ROLL_BACK_SAF_GRANT' red-v154-dedicated-root.log
          grep -F 'FAIL=V153_APP_STORAGE_HAS_ONE_TIME_MIGRATION_MARKER' red-v154-dedicated-root.log
          echo V154_DEDICATED_ROOT_RED_PHASE_CONFIRMED
      - uses: actions/upload-artifact@v7
        with:
          name: trime-ac-v1.5.4-dedicated-root-red-evidence
          path: red-v154-dedicated-root.log
          retention-days: 30

  build:
    needs: red-dedicated-root
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Checkout pinned Trime
        uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: trime/**/*.gradle*
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"
      - name: Restore v1.5.3 fixed-signing source baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = "2a027a0affdadd43194e6b3dc12cfffdd1426379"
          url = f"https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml"
          data = urllib.request.urlopen(url, timeout=60).read()
          got = hashlib.sha256(data).hexdigest()
          expected = "c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92"
          if got != expected:
              raise SystemExit(f"Frost chars SHA mismatch: {got}")
          pathlib.Path("frost-chars.dict.yaml").write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
      - name: Apply v1.5.4 dedicated external root
        run: python3 harness/trime-ac-dualzone/apply_v154.py trime
      - name: GREEN v1.5.4 dedicated-root contract
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/verify_v154_dedicated_root.py trime | tee green-v154-dedicated-root.log
          grep -F 'V154_DEDICATED_ROOT_CONTRACT=PASS' green-v154-dedicated-root.log
      - name: Re-verify v1.5.2 Ctrl+P session contract
        run: python3 harness/trime-ac-dualzone/verify_v152_session_maintenance.py trime
      - name: Verify production hygiene
        shell: bash
        run: |
          cd trime
          git add -N .
          git diff --check
          git diff > ../trime-ac-v1.5.4-dedicated-root.patch
          grep -F 'DataStorageMode.EXTERNAL_SYNC)' app/src/main/java/com/osfans/trime/data/prefs/AppPrefs.kt
          grep -F 'AC_EXTERNAL_DIR_NAME = "AC-Trime"' app/src/main/java/com/osfans/trime/data/sync/RimeDataSync.kt
          grep -F 'dataPathPicker.launch(RimeDataSync.acExternalInitialUri())' app/src/main/java/com/osfans/trime/ui/setup/SetupActivity.kt
          if grep -F 'RimeDataSync.clearExternalTree(this@SetupActivity)' app/src/main/java/com/osfans/trime/ui/setup/SetupActivity.kt; then exit 1; fi
          test "$(wc -l < app/src/main/assets/ac_wubi86_stems.tsv)" -eq 27529
          echo "${STEM_ASSET_SHA256}  app/src/main/assets/ac_wubi86_stems.tsv" | sha256sum -c -
          if git diff --name-only | grep -F 'tongwenfeng.trime.yaml'; then exit 1; fi
      - name: Restore fixed AC debug signing key
        shell: bash
        env:
          AC_DEBUG_KEYSTORE_B64: ${{ secrets.AC_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${AC_DEBUG_KEYSTORE_B64:-}"
          mkdir -p "$HOME/.android"
          printf '%s' "$AC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$actual" = "$AC_DEBUG_CERT_SHA256"
          printf 'AC_FIXED_SIGNING_STATUS=ENABLED\nCERT_SHA256=%s\n' "$actual" > ac-signing-status.txt
      - name: GREEN focused regressions
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.ime.keyboard.AcDualZoneTest \
            --tests com.osfans.trime.daemon.RimeApiForwarderTest \
            --tests com.osfans.trime.ime.keyboard.AcCtrlSpacePolicyTest \
            --tests com.osfans.trime.ime.core.AcSelectAllFallbackTest \
            --tests com.osfans.trime.ime.core.AcCtrlVimShortcutTest \
            --tests com.osfans.trime.data.prefs.AcKeyboardHookDefaultsTest \
            --tests com.osfans.trime.ime.core.AcAddWordShortcutTest
      - name: GREEN full debug unit-test suite
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest
      - name: Build patched debug APK
        run: |
          cd trime
          make debug
      - name: Verify fixed APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signing.txt
          digest="$(awk -F': ' '/certificate SHA-256 digest/{print toupper($2); exit}' apk-signing.txt)"
          test "$digest" = "$AC_DEBUG_CERT_SHA256"
          echo FIXED_SIGNING_APK_CERT=PASS
      - name: Package v1.5.4 artifact
        shell: bash
        run: |
          set -euo pipefail
          PKG=Trime-AC-v1.5.4-Dedicated-Data-Root
          mkdir -p "$PKG"
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          cp "$APK" "$PKG/Trime-AC-v1.5.4-Dedicated-Data-Root-arm64-debug.apk"
          cp trime-ac-v1.5.4-dedicated-root.patch "$PKG/"
          cp green-v154-dedicated-root.log "$PKG/"
          cp ac-signing-status.txt "$PKG/"
          cp apk-signing.txt "$PKG/"
          cat > "$PKG/README.txt" <<'EOF'
          Trime AC v1.5.4 Dedicated Data Root

          Changes:
          - fresh AC installs default to EXTERNAL_SYNC
          - the picker starts at /sdcard/AC-Trime
          - only an AC-Trime tree is accepted, keeping SAF traversal scoped to the dedicated AC data tree
          - a successful SAF grant is retained even if the first import fails
          - existing v1.5.3 APP_STORAGE users are migrated once to the new AC external-sync default
          - APP_STORAGE remains available after the one-time migration
          - v1.5.2 Ctrl+P session-only maintenance remains preserved

          Signing:
          - permanent AC debug signing key required and verified in CI
          EOF
          (cd "$PKG" && sha256sum * > SHA256SUMS.txt)
          zip -r "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" | tee v154-package-sha256.txt
      - name: Upload v1.5.4 artifact
        uses: actions/upload-artifact@v7
        with:
          name: trime-ac-v1.5.4-dedicated-data-root
          path: |
            Trime-AC-v1.5.4-Dedicated-Data-Root.zip
            Trime-AC-v1.5.4-Dedicated-Data-Root/
            v154-package-sha256.txt
          retention-days: 30

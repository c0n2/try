name: Trime AC v1.5.6 iOS Colors

on:
  push:
    branches: [trime-ac-v156-ios-colors]
    paths:
      - 'trime-ac-dualzone/verify_v156_ios_colors.py'
      - 'trime-ac-dualzone/apply_v156.py'
      - '.github/workflows/trime-ac-v156.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NAME: AC Trime v1.5.6 iOS Colors
  BUILD_ABI: arm64-v8a
  TRIME_REF: 75844aef84f3849c7f6dd49a52bb75c46200af44
  FROST_REF: 2a027a0affdadd43194e6b3dc12cfffdd1426379
  FROST_CHARS_SHA256: c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92
  STEM_ASSET_SHA256: 72c1fef8f31ffd5643391f3bc6c22c74f474218284fc5fcc2c688874aab2bf4b
  AC_DEBUG_CERT_SHA256: 046B7F50C9BA2FD1E810EEABF246A4A5019F8344D52CEBE6C61EEF7E99CEC181

jobs:
  red-theme:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - name: Restore v1.5.4 application baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = "2a027a0affdadd43194e6b3dc12cfffdd1426379"
          data = urllib.request.urlopen(f"https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml", timeout=60).read()
          if hashlib.sha256(data).hexdigest() != "c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92":
              raise SystemExit("Frost chars SHA mismatch")
          pathlib.Path("frost-chars.dict.yaml").write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
          python3 harness/trime-ac-dualzone/apply_v154.py trime
      - name: Replay RED v1.5.6 iOS color contract
        shell: bash
        run: |
          set +e
          python3 harness/trime-ac-dualzone/verify_v156_ios_colors.py trime > red-v156.log 2>&1
          rc=$?
          set -e
          cat red-v156.log
          test "$rc" -ne 0
          grep -F 'FAIL=IOS_LIGHT_EXISTS' red-v156.log
          grep -F 'FAIL=IOS_DARK_EXISTS' red-v156.log
          grep -F 'V156_IOS_COLOR_CONTRACT=FAIL:' red-v156.log
          echo V156_IOS_COLOR_RED_PHASE_CONFIRMED

  build:
    needs: red-theme
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: trime/**/*.gradle*
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"
      - name: Restore v1.5.4 application baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = "2a027a0affdadd43194e6b3dc12cfffdd1426379"
          data = urllib.request.urlopen(f"https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml", timeout=60).read()
          if hashlib.sha256(data).hexdigest() != "c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92":
              raise SystemExit("Frost chars SHA mismatch")
          pathlib.Path("frost-chars.dict.yaml").write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
          python3 harness/trime-ac-dualzone/apply_v154.py trime
      - name: Apply v1.5.6 iOS color schemes
        run: python3 harness/trime-ac-dualzone/apply_v156.py trime
      - name: GREEN v1.5.6 color contract
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/verify_v156_ios_colors.py trime | tee green-v156.log
          grep -F 'V156_IOS_COLOR_CONTRACT=PASS' green-v156.log
      - name: Verify change scope
        shell: bash
        run: |
          cd trime
          git add -N .
          git diff --check
          git diff > ../trime-ac-v1.5.6-ios-colors.patch
          git diff --name-only | tee ../v156-changed-files.txt
          git diff -- app/src/main/assets/shared/trime.yaml > ../v156-theme.diff
          if git diff --name-only | grep -F 'tongwenfeng.trime.yaml'; then exit 1; fi
          grep -F 'ac_ios_light:' app/src/main/assets/shared/trime.yaml
          grep -F 'ac_ios_dark:' app/src/main/assets/shared/trime.yaml
          echo V156_THEME_SCOPE=PASS
      - name: Restore fixed AC debug signing key
        shell: bash
        env:
          AC_DEBUG_KEYSTORE_B64: ${{ secrets.AC_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${AC_DEBUG_KEYSTORE_B64:-}"
          mkdir -p "$HOME/.android"
          printf '%s' "$AC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$actual" = "$AC_DEBUG_CERT_SHA256"
          printf 'AC_FIXED_SIGNING_STATUS=ENABLED\nCERT_SHA256=%s\n' "$actual" > ac-signing-status.txt
      - name: Theme parser focused regressions
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.data.theme.ThemeLoaderTest \
            --tests com.osfans.trime.data.theme.ThemeDslExpanderTest \
            --tests com.osfans.trime.data.theme.TextKeyboardTest
      - name: Re-verify Ctrl+P regression contract
        run: python3 harness/trime-ac-dualzone/verify_v152_session_maintenance.py trime
      - name: Full debug unit-test suite
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest
      - name: Build fixed-signing debug APK
        run: |
          cd trime
          make debug
      - name: Verify fixed APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signing.txt
          digest="$(awk -F': ' '/certificate SHA-256 digest/{print toupper($2); exit}' apk-signing.txt)"
          test "$digest" = "$AC_DEBUG_CERT_SHA256"
          echo FIXED_SIGNING_APK_CERT=PASS
      - name: Package v1.5.6
        shell: bash
        run: |
          set -euo pipefail
          PKG=Trime-AC-v1.5.6-iOS-Colors
          mkdir -p "$PKG"
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          cp "$APK" "$PKG/Trime-AC-v1.5.6-iOS-Colors-arm64-debug.apk"
          cp trime-ac-v1.5.6-ios-colors.patch "$PKG/"
          cp green-v156.log "$PKG/"
          cp v156-theme.diff "$PKG/"
          cp ac-signing-status.txt "$PKG/"
          cp apk-signing.txt "$PKG/"
          cat > "$PKG/README.txt" <<'EOF'
          Trime AC v1.5.6 — AC iOS Light / Dark

          Scope:
          - adds AC iOS Light and AC iOS Dark to preset_color_schemes
          - YAML colors only; no PNG assets
          - keyboard geometry/layout is unchanged
          - tongwenfeng.trime.yaml is untouched
          - v1.5.4 app behavior remains the application baseline
          - v1.5.5 Z reverse lookup remains external AC-Trime data and is preserved by in-place upgrade

          Install:
          adb install -r Trime-AC-v1.5.6-iOS-Colors-arm64-debug.apk

          Then open Trime theme/color settings and select AC iOS Light or AC iOS Dark.
          EOF
          (cd "$PKG" && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          zip -qr "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" | tee v156-package-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: trime-ac-v1.5.6-ios-colors
          path: |
            Trime-AC-v1.5.6-iOS-Colors.zip
            Trime-AC-v1.5.6-iOS-Colors/
            v156-package-sha256.txt
          retention-days: 30

name: Trime AC v1.5.7 Candidate Swipe

on:
  push:
    branches: [trime-ac-v157-candidate-swipe]
    paths:
      - 'trime-ac-dualzone/verify_v157_candidate_swipe.py'
      - 'trime-ac-dualzone/apply_v157.py'
      - '.github/workflows/trime-ac-v157.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NAME: AC Trime v1.5.7 Candidate Swipe
  BUILD_ABI: arm64-v8a
  TRIME_REF: 75844aef84f3849c7f6dd49a52bb75c46200af44
  FROST_REF: 2a027a0affdadd43194e6b3dc12cfffdd1426379
  FROST_CHARS_SHA256: c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92
  AC_DEBUG_CERT_SHA256: 046B7F50C9BA2FD1E810EEABF246A4A5019F8344D52CEBE6C61EEF7E99CEC181

jobs:
  red-contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - name: Restore v1.5.6 application baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = '2a027a0affdadd43194e6b3dc12cfffdd1426379'
          data = urllib.request.urlopen(f'https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml', timeout=60).read()
          if hashlib.sha256(data).hexdigest() != 'c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92':
              raise SystemExit('Frost chars SHA mismatch')
          pathlib.Path('frost-chars.dict.yaml').write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
          python3 harness/trime-ac-dualzone/apply_v154.py trime
          python3 harness/trime-ac-dualzone/apply_v156.py trime
      - name: Replay RED v1.5.7 contract
        shell: bash
        run: |
          set +e
          python3 harness/trime-ac-dualzone/verify_v157_candidate_swipe.py trime > red-v157.log 2>&1
          rc=$?
          set -e
          cat red-v157.log
          test "$rc" -ne 0
          grep -F 'FAIL=HORIZONTAL_SCROLL_ENABLED' red-v157.log
          grep -F 'FAIL=IOS_LIGHT_KEY_SYMBOL_COLOR_PURE_BLACK' red-v157.log
          grep -F 'V157_CANDIDATE_SWIPE_CONTRACT=FAIL:' red-v157.log
          echo V157_RED_PHASE_CONFIRMED

  build:
    needs: red-contract
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: trime/**/*.gradle*
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"
      - name: Restore v1.5.6 application baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = '2a027a0affdadd43194e6b3dc12cfffdd1426379'
          data = urllib.request.urlopen(f'https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml', timeout=60).read()
          if hashlib.sha256(data).hexdigest() != 'c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92':
              raise SystemExit('Frost chars SHA mismatch')
          pathlib.Path('frost-chars.dict.yaml').write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
          python3 harness/trime-ac-dualzone/apply_v154.py trime
          python3 harness/trime-ac-dualzone/apply_v156.py trime
      - name: Snapshot v1.5.6 scoped files
        shell: bash
        run: |
          cp trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateDelegate.kt /tmp/v156-CompactCandidateDelegate.kt
          cp trime/app/src/main/assets/shared/trime.yaml /tmp/v156-trime.yaml
      - name: Apply v1.5.7 candidate swipe
        run: python3 harness/trime-ac-dualzone/apply_v157.py trime
      - name: GREEN v1.5.7 contract
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/verify_v157_candidate_swipe.py trime | tee green-v157.log
          grep -F 'V157_CANDIDATE_SWIPE_CONTRACT=PASS' green-v157.log
      - name: Verify v1.5.7 scoped diff
        shell: bash
        run: |
          set -euo pipefail
          diff -u /tmp/v156-CompactCandidateDelegate.kt trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateDelegate.kt > v157-candidate.diff || test $? -eq 1
          diff -u /tmp/v156-trime.yaml trime/app/src/main/assets/shared/trime.yaml > v157-theme.diff || test $? -eq 1
          grep -F 'canScrollHorizontally(): Boolean = true' trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateDelegate.kt
          grep -F 'flexWrap = FlexWrap.NOWRAP' trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateDelegate.kt
          grep -F 'scrollToPosition(0)' trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateDelegate.kt
          grep -F 'key_symbol_color: 0x000000' trime/app/src/main/assets/shared/trime.yaml
          if grep -F 'tongwenfeng.trime.yaml' v157-candidate.diff v157-theme.diff; then exit 1; fi
          echo V157_SCOPE=PASS
      - name: Restore fixed AC debug signing key
        shell: bash
        env:
          AC_DEBUG_KEYSTORE_B64: ${{ secrets.AC_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${AC_DEBUG_KEYSTORE_B64:-}"
          mkdir -p "$HOME/.android"
          printf '%s' "$AC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$actual" = "$AC_DEBUG_CERT_SHA256"
          printf 'AC_FIXED_SIGNING_STATUS=ENABLED\nCERT_SHA256=%s\n' "$actual" > ac-signing-status.txt
      - name: Theme regressions
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.data.theme.ThemeLoaderTest \
            --tests com.osfans.trime.data.theme.ThemeGoldenTest
      - name: Re-verify Ctrl+P regression contract
        run: python3 harness/trime-ac-dualzone/verify_v152_session_maintenance.py trime
      - name: Full debug unit-test suite
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest
      - name: Build fixed-signing debug APK
        run: |
          cd trime
          make debug
      - name: Verify fixed APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signing.txt
          digest="$(awk -F': ' '/certificate SHA-256 digest/{print toupper($2); exit}' apk-signing.txt)"
          test "$digest" = "$AC_DEBUG_CERT_SHA256"
          echo FIXED_SIGNING_APK_CERT=PASS
      - name: Package v1.5.7
        shell: bash
        run: |
          set -euo pipefail
          PKG=Trime-AC-v1.5.7-Candidate-Swipe
          mkdir -p "$PKG"
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          cp "$APK" "$PKG/Trime-AC-v1.5.7-Candidate-Swipe-arm64-debug.apk"
          cp green-v157.log "$PKG/"
          cp v157-candidate.diff "$PKG/"
          cp v157-theme.diff "$PKG/"
          cp ac-signing-status.txt "$PKG/"
          cp apk-signing.txt "$PKG/"
          cat > "$PKG/README.txt" <<'EOF'
          Trime AC v1.5.7 — Candidate Swipe + Black Symbols

          Changes from v1.5.6:
          - compact candidate strip is a single horizontal NOWRAP row
          - swipe left to reveal later bulk candidates; swipe right to return
          - the existing down-arrow expanded candidate list remains available
          - new candidate data resets the compact strip to its first candidate
          - AC iOS Light secondary key symbols are pure black for readability
          - AC iOS Dark is unchanged
          - keyboard layout/geometry, Ctrl+P and Z reverse lookup behavior are not intentionally changed

          Install in place with the permanent AC debug key:
          adb install -r Trime-AC-v1.5.7-Candidate-Swipe-arm64-debug.apk
          EOF
          (cd "$PKG" && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          zip -qr "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" | tee v157-package-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: trime-ac-v1.5.7-candidate-swipe
          path: |
            Trime-AC-v1.5.7-Candidate-Swipe.zip
            Trime-AC-v1.5.7-Candidate-Swipe/
            v157-package-sha256.txt
          retention-days: 30

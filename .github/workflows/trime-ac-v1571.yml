name: Trime AC v1.5.7.1 Candidate Overflow Hotfix

on:
  push:
    branches: [trime-ac-v1571-candidate-swipe-hotfix]
    paths:
      - 'trime-ac-dualzone/verify_v1571_candidate_overflow.py'
      - 'trime-ac-dualzone/apply_v1571.py'
      - '.github/workflows/trime-ac-v1571.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NAME: AC Trime v1.5.7.1 Candidate Overflow Hotfix
  BUILD_ABI: arm64-v8a
  TRIME_REF: 75844aef84f3849c7f6dd49a52bb75c46200af44
  FROST_REF: 2a027a0affdadd43194e6b3dc12cfffdd1426379
  FROST_CHARS_SHA256: c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92
  AC_DEBUG_CERT_SHA256: 046B7F50C9BA2FD1E810EEABF246A4A5019F8344D52CEBE6C61EEF7E99CEC181

jobs:
  red-contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - name: Restore v1.5.7 faulty candidate baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = '2a027a0affdadd43194e6b3dc12cfffdd1426379'
          data = urllib.request.urlopen(f'https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml', timeout=60).read()
          if hashlib.sha256(data).hexdigest() != 'c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92':
              raise SystemExit('Frost chars SHA mismatch')
          pathlib.Path('frost-chars.dict.yaml').write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
          python3 harness/trime-ac-dualzone/apply_v154.py trime
          python3 harness/trime-ac-dualzone/apply_v156.py trime
          python3 harness/trime-ac-dualzone/apply_v157.py trime
      - name: Confirm v1.5.7 contract still passes despite device bug
        run: python3 harness/trime-ac-dualzone/verify_v157_candidate_swipe.py trime
      - name: RED v1.5.7.1 candidate overflow contract
        shell: bash
        run: |
          set +e
          python3 harness/trime-ac-dualzone/verify_v1571_candidate_overflow.py trime > red-v1571.log 2>&1
          rc=$?
          set -e
          cat red-v1571.log
          test "$rc" -ne 0
          grep -F 'PASS=CANDIDATE_BIND_LAYOUT_PARAMS_FOUND' red-v1571.log
          grep -F 'FAIL=CANDIDATE_FLEX_SHRINK_DISABLED' red-v1571.log
          grep -F 'V1571_CANDIDATE_OVERFLOW_CONTRACT=FAIL:CANDIDATE_FLEX_SHRINK_DISABLED' red-v1571.log
          echo V1571_RED_PHASE_CONFIRMED

  build:
    needs: red-contract
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: osfans/trime
          ref: ${{ env.TRIME_REF }}
          submodules: recursive
          fetch-depth: 0
          path: trime
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: trime/**/*.gradle*
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"
      - name: Restore v1.5.7 faulty candidate baseline
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_patch.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_hotfix_471.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v13.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v131.py trime --phase impl
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v14.py trime --phase impl
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v14-meta
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          ref = '2a027a0affdadd43194e6b3dc12cfffdd1426379'
          data = urllib.request.urlopen(f'https://raw.githubusercontent.com/gaboolic/rime-frost/{ref}/cn_dicts_wb/chars.dict.yaml', timeout=60).read()
          if hashlib.sha256(data).hexdigest() != 'c2adeceb8b670d6e33798517a432b479bf657df312eae6b2be88cc1a7eb0ad92':
              raise SystemExit('Frost chars SHA mismatch')
          pathlib.Path('frost-chars.dict.yaml').write_bytes(data)
          PY
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase tests
          python3 harness/trime-ac-dualzone/apply_v15.py trime --phase impl --frost-chars frost-chars.dict.yaml
          python3 harness/trime-ac-dualzone/repair_v15_build.py trime --phase v15-post
          python3 harness/trime-ac-dualzone/apply_v151.py trime
          python3 harness/trime-ac-dualzone/apply_v152.py trime
          python3 harness/trime-ac-dualzone/apply_v153.py trime
          python3 harness/trime-ac-dualzone/apply_v154.py trime
          python3 harness/trime-ac-dualzone/apply_v156.py trime
          python3 harness/trime-ac-dualzone/apply_v157.py trime
      - name: Snapshot faulty v1.5.7 adapter
        run: cp trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateViewAdapter.kt /tmp/v157-CompactCandidateViewAdapter.kt
      - name: Apply v1.5.7.1 candidate overflow hotfix
        run: python3 harness/trime-ac-dualzone/apply_v1571.py trime
      - name: GREEN v1.5.7.1 overflow contract
        shell: bash
        run: |
          python3 harness/trime-ac-dualzone/verify_v1571_candidate_overflow.py trime | tee green-v1571.log
          grep -F 'V1571_CANDIDATE_OVERFLOW_CONTRACT=PASS' green-v1571.log
      - name: Re-verify v1.5.7 feature contract
        run: python3 harness/trime-ac-dualzone/verify_v157_candidate_swipe.py trime
      - name: Verify hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          diff -u /tmp/v157-CompactCandidateViewAdapter.kt trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateViewAdapter.kt > v1571-adapter.diff || test $? -eq 1
          grep -F 'flexShrink = 0f' trime/app/src/main/java/com/osfans/trime/ime/candidates/compact/CompactCandidateViewAdapter.kt
          test "$(grep -c '^+' v1571-adapter.diff)" -eq 2
          test "$(grep -c '^-' v1571-adapter.diff)" -eq 1
          if grep -F 'tongwenfeng.trime.yaml' v1571-adapter.diff; then exit 1; fi
          echo V1571_SCOPE=PASS
      - name: Restore fixed AC debug signing key
        shell: bash
        env:
          AC_DEBUG_KEYSTORE_B64: ${{ secrets.AC_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${AC_DEBUG_KEYSTORE_B64:-}"
          mkdir -p "$HOME/.android"
          printf '%s' "$AC_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$actual" = "$AC_DEBUG_CERT_SHA256"
          printf 'AC_FIXED_SIGNING_STATUS=ENABLED\nCERT_SHA256=%s\n' "$actual" > ac-signing-status.txt
      - name: Theme regressions
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest \
            --tests com.osfans.trime.data.theme.ThemeLoaderTest \
            --tests com.osfans.trime.data.theme.ThemeGoldenTest
      - name: Re-verify Ctrl+P regression contract
        run: python3 harness/trime-ac-dualzone/verify_v152_session_maintenance.py trime
      - name: Full debug unit-test suite
        run: |
          cd trime
          ./gradlew :app:testDebugUnitTest
      - name: Build fixed-signing debug APK
        run: |
          cd trime
          make debug
      - name: Verify fixed APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signing.txt
          digest="$(awk -F': ' '/certificate SHA-256 digest/{print toupper($2); exit}' apk-signing.txt)"
          test "$digest" = "$AC_DEBUG_CERT_SHA256"
          echo FIXED_SIGNING_APK_CERT=PASS
      - name: Package v1.5.7.1
        shell: bash
        run: |
          set -euo pipefail
          PKG=Trime-AC-v1.5.7.1-Candidate-Overflow-Hotfix
          mkdir -p "$PKG"
          APK="$(find trime/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          cp "$APK" "$PKG/Trime-AC-v1.5.7.1-Candidate-Overflow-Hotfix-arm64-debug.apk"
          cp green-v1571.log "$PKG/"
          cp v1571-adapter.diff "$PKG/"
          cp ac-signing-status.txt "$PKG/"
          cp apk-signing.txt "$PKG/"
          cat > "$PKG/README.txt" <<'EOF'
          Trime AC v1.5.7.1 — Candidate Overflow Hotfix

          Fix from v1.5.7:
          - disables Flexbox flexShrink for compact candidate items
          - candidate text keeps its natural/minimum width instead of being compressed into one screen
          - overflowing candidates can therefore form real horizontal overflow for left/right swiping
          - v1.5.7 NOWRAP row, down-arrow expansion, reset-to-head behavior and Light pure-black symbols are retained
          - keyboard geometry, Ctrl+P and Z reverse lookup are not intentionally changed

          Install in place with the permanent AC debug key:
          adb install -r Trime-AC-v1.5.7.1-Candidate-Overflow-Hotfix-arm64-debug.apk
          EOF
          (cd "$PKG" && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          zip -qr "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" | tee v1571-package-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: trime-ac-v1.5.7.1-candidate-overflow-hotfix
          path: |
            Trime-AC-v1.5.7.1-Candidate-Overflow-Hotfix.zip
            Trime-AC-v1.5.7.1-Candidate-Overflow-Hotfix/
            v1571-package-sha256.txt
          retention-days: 30
